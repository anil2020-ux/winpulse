name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/WinPulse/WinPulse.csproj

      - name: Build
        run: dotnet build src/WinPulse/WinPulse.csproj -c Release --no-restore

      - name: Self-test
        run: dotnet run --project src/WinPulse/WinPulse.csproj -c Release --no-build -- --selftest

      - name: Publish single-file x64
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet publish src/WinPulse/WinPulse.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o artifacts/publish

      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item scripts/uninstall.ps1 artifacts/publish/uninstall.ps1 -Force
          Compress-Archive -Path artifacts/publish/WinPulse.exe, artifacts/publish/uninstall.ps1 `
            -DestinationPath artifacts/WinPulse-win-x64.zip -CompressionLevel Optimal
          Get-Item artifacts/WinPulse-win-x64.zip | Select-Object Name, Length

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: WinPulse-win-x64
          path: artifacts/WinPulse-win-x64.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "artifacts/WinPulse-win-x64.zip"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --title "WinPulse $tag" --generate-notes
          }
